<div class="champ{% if champ.errors %} champ--erreur{% endif %}">
  <label for="{{ champ.id_for_label }}">{{ champ.label }}{% if champ.field.required %}<span class="req" aria-hidden="true"> *</span>{% endif %}</label>
  {{ champ }}
  {% if champ.help_text %}<p class="aide">{{ champ.help_text }}</p>{% endif %}
  {% for e in champ.errors %}<p class="erreur">{{ e }}</p>{% endfor %}
</div>
